services:
  behavioral-captcha:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: behavioral-captcha
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - BEHAVIORAL_HOST=0.0.0.0
      - BEHAVIORAL_PORT=8010
    volumes:
      - ./datasets:/app/datasets
      - ./temp:/app/temp
